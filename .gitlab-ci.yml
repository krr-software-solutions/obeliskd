# obeliskd CI: the pre-merge checks on MRs, and the whole release from a version tag (as rustable).
#
# The version comes from the tag. Cargo.toml carries the placeholder `0.0.0`; every job that builds
# or publishes a release first runs `scripts/set-version.sh "$CI_COMMIT_TAG"` (`v1.2.3` → `1.2.3`).
# Cut a release by tagging the merged `main`: `git tag v1.2.3 && git push origin v1.2.3`.
#
# An MR runs:
#   test     check-pre-merge       no fix-before-merge markers left behind
#            check                 fmt, clippy, tests
#            check-target: [<t>]   clippy for the other supported OSes, so their platform code compiles
#            shellcheck            install.sh and scripts/
#            publish-dry-run       both crates, packaged and verified as crates.io will see them
#   build    build: [<target>]     the `obeliskd` binary per target (cargo-zigbuild, all from Linux); manual
#
# A release tag runs check, check-target and build, then:
#   publish  gitlab-release        archives → generic package registry, and the GitLab release
#            github-release        the tag + archives + install.sh → the public GitHub mirror's release
#            install-smoke         install.sh from that release (binary only: CI has no systemd) installs that version
#            publish-crates        `cargo publish --workspace` → crates.io
#
# Everything in `publish` waits for every check and build, so a failing build never leaves a
# half-published version behind. crates.io versions can't be replaced, so publish-crates also waits
# for both releases and the install smoke test.
#
# CI variables (Settings → CI/CD → Variables):
#   CARGO_REGISTRY_TOKEN   crates.io token (masked)
#   GITHUB_TOKEN           can write github.com/krr-software-solutions/obeliskd (the public mirror)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

include:
  - project: 'krrss/util/pipeline-utils'
    ref: main
    file: '/util.yaml'

stages:
  - test
  - build
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: always

# A Rust job: the cargo registry is cached per Cargo.lock.
.rust:
  image: rust:1
  variables:
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  cache:
    key:
      files: [Cargo.lock]
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/

# Release jobs stamp the tag's version into the workspace first (MR pipelines keep 0.0.0).
.set-version:
  before_script:
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then scripts/set-version.sh "$CI_COMMIT_TAG"; fi

# ----- test -----

check-pre-merge:
  extends:
    - .runner
    - ".mr=auto,tag=never"
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/check-for-fix.sh

check:
  extends:
    - .runner
    - .rust
    - ".mr=auto,tag=auto"
  stage: test
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked

# Clippy for each other supported OS (`check` covers Linux), so platform code that this pipeline doesn't
# otherwise build still compiles. Checking needs only the target's std, no linker.
check-target:
  extends:
    - .runner
    - .rust
    - ".mr=auto,tag=auto"
  stage: test
  parallel:
    matrix:
      - TARGET:
          - aarch64-apple-darwin
          # x86_64-pc-windows-gnu: re-add once Windows is supported (platform/windows.rs)
  script:
    - rustup component add clippy
    - rustup target add "$TARGET"
    - cargo clippy --workspace --all-targets --locked --target "$TARGET" -- -D warnings

shellcheck:
  extends:
    - .runner
    - ".mr=auto,tag=never"
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck install.sh scripts/*.sh

# Packages and verifies every crate the way crates.io will see it (with the 0.0.0 placeholder).
publish-dry-run:
  extends:
    - .runner
    - .rust
    - ".mr=auto,tag=never"
  stage: test
  script:
    - cargo publish --workspace --dry-run --locked

# ----- build -----

# The CLI/daemon for one target, cross-compiled with cargo-zigbuild. zig's linker ad-hoc signs the
# aarch64-apple-darwin binary, which is all Apple Silicon needs to run a binary that isn't
# quarantined (curl). Manual on MRs, to try a build.
build:
  extends:
    - .runner
    - .rust
    - ".mr=manual,tag=auto"
  stage: build
  needs: []
  image: ghcr.io/rust-cross/cargo-zigbuild:0.24.0
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
  script:
    - rustup toolchain install stable --profile minimal --no-self-update
    - rustup default stable
    - rustup target add "$TARGET"
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then scripts/set-version.sh "$CI_COMMIT_TAG"; fi
    - cargo zigbuild --release --locked -p obeliskd-cli --target "$TARGET"
    - version="${CI_COMMIT_TAG:-v0.0.0}"; version="${version#v}"
    - name="obeliskd-$version-$TARGET"
    - mkdir -p "dist/$name"
    - cp "target/$TARGET/release/obeliskd" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
    - tar -C dist -czf "dist/$name.tar.gz" "$name"
    - (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
  artifacts:
    expire_in: 1 week
    paths:
      - dist/*.tar.gz
      - dist/*.tar.gz.sha256

# ----- publish -----

gitlab-release:
  extends:
    - .runner
    - ".mr=never,tag=auto"
  stage: publish
  needs: [check, check-target, build]
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl jq
  script:
    - scripts/gitlab-release.sh

# The public release: GitLab (and its packages) stay private.
github-release:
  extends:
    - .runner
    - ".mr=never,tag=auto"
  stage: publish
  needs: [check, check-target, build]
  image: alpine:3.21
  variables:
    GIT_DEPTH: "0"   # pushing the tag needs its history
  before_script:
    - apk add --no-cache git github-cli
  script:
    - scripts/github-release.sh

# install.sh, fetched from the release just published, must install that exact version. Binary only
# (OBELISKD_INSTALL_DIR): CI containers have no systemd for `manage install`.
install-smoke:
  extends:
    - .runner
    - ".mr=never,tag=auto"
  stage: publish
  needs: [github-release]
  parallel:
    matrix:
      - IMAGE: ["alpine:3.21", "debian:13"]
  image: $IMAGE
  variables:
    GIT_STRATEGY: none   # tests the published script, not the checkout
  script:
    - if ! command -v wget > /dev/null; then apt-get -qq update && apt-get -qq install -y wget ca-certificates > /dev/null; fi
    - version="${CI_COMMIT_TAG#v}"
    - wget -qO install.sh "https://github.com/krr-software-solutions/obeliskd/releases/download/$CI_COMMIT_TAG/install.sh"
    - OBELISKD_VERSION="$version" OBELISKD_INSTALL_DIR="$PWD/bin" sh install.sh
    - test "$("$PWD/bin/obeliskd" --version)" = "obeliskd $version"

publish-crates:
  extends:
    - .runner
    - .rust
    - .set-version
    - ".mr=never,tag=auto"
  stage: publish
  needs: [check, check-target, build, gitlab-release, github-release, install-smoke]
  script:
    - '[ -n "${CARGO_REGISTRY_TOKEN:-}" ] || { echo "CARGO_REGISTRY_TOKEN is not set"; exit 1; }'
    # set-version just rewrote Cargo.toml/Cargo.lock, hence --allow-dirty.
    - cargo publish --workspace --locked --allow-dirty
