[workspace]
resolver = "3"
members = [
    "code/obeliskd",
    "code/obeliskd-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://gitlab.krr-software-solutions.com/oss/obeliskd"
homepage = "https://gitlab.krr-software-solutions.com/oss/obeliskd"
readme = "README.md"

[workspace.dependencies]
# workspace crates
obeliskd = { path = "code/obeliskd", version = "=0.0.0" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
nix = { version = "0.31", features = ["fs", "user"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

# dev
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
