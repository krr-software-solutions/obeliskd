[workspace]
resolver = "3"
members = [
    "code/obeliskd",
    "code/obeliskd-cli",
]

[workspace.package]
# Placeholder: the real version comes from the git tag. CI runs `scripts/set-version.sh`
# (`v1.2.3` → `1.2.3`) before building or publishing, so local builds report 0.0.0.
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krr-software-solutions/obeliskd"
homepage = "https://github.com/krr-software-solutions/obeliskd"
readme = "README.md"
keywords = ["dns", "local-development", "ip-allocation", "docker", "k3d"]

[workspace.dependencies]
# workspace crates: published together, so each pins the others exactly. The `0.0.0` here is
# the same placeholder as above and is rewritten along with it.
obeliskd = { path = "code/obeliskd", version = "=0.0.0" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
nix = { version = "0.31", features = ["fs", "user"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

# dev
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
